[project]
name = "agency-content-pipeline"
version = "0.1.0"
description = "LangGraph agent: client brief → WordPress drafts with human approval"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "anthropic>=0.40,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
]
notifications = [
    "sendgrid>=6.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
    "respx>=0.21",
]
all = [
    "agency-content-pipeline[google,notifications,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
